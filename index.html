<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KelimeMatik Pro</title>
    <style>
        :root {
            --bg-color: #121213;
            --card-bg: #1e1e1f;
            --text-color: #ffffff;
            --border-color: #3a3a3c;
            --correct-color: #538d4e;
            --present-color: #b59f3b;
            --absent-color: #3a3a3c;
            --key-bg: #818384;
            --key-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Üst Menü */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-color);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ffffff, #aaaaaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-btns {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            transition: 0.2s opacity;
        }

        .icon-btn:active { transform: scale(0.9); }
        .icon-btn.used { opacity: 0.3; pointer-events: none; }

        .lang-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Oyun Modu Seçimi */
        .mode-container {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            background: var(--card-bg);
            padding: 5px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            padding: 8px 20px;
            border: none;
            background: transparent;
            color: #888;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s all;
        }

        .mode-btn.active {
            background: #2196f3;
            color: white;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.4);
        }

        /* Oyun Tahtası */
        .board-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow: hidden;
        }

        #game-board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 6px;
            width: 100%;
            max-width: 380px;
            padding: 10px;
            aspect-ratio: 5/6;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 6px;
        }

        .tile {
            width: 100%;
            height: 100%;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: bold;
            text-transform: uppercase;
            background-color: var(--bg-color);
            transition: border-color 0.1s;
        }

        .tile[data-state="pop"] { animation: pop 0.15s ease-out; border-color: #787c7e; }
        .tile[data-state="correct"] { background: var(--correct-color); border-color: var(--correct-color); color: white; box-shadow: 0 0 10px rgba(83, 141, 78, 0.4); }
        .tile[data-state="present"] { background: var(--present-color); border-color: var(--present-color); color: white; }
        .tile[data-state="absent"] { background: var(--absent-color); border-color: var(--absent-color); color: white; }

        .flip { animation: flip 0.6s ease forwards; }
        .shake { animation: shake 0.5s; }

        /* Klavye */
        #keyboard {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 10px 20px 10px;
            background: var(--bg-color);
        }

        .k-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .key {
            background-color: var(--key-bg);
            color: var(--key-text);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            height: 55px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 2px 2px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .key:active { transform: scale(0.92); background-color: #999; }
        .key.wide { flex: 1.6; font-size: 0.9rem; background-color: #656768; }

        .key[data-state="correct"] { background-color: var(--correct-color); }
        .key[data-state="present"] { background-color: var(--present-color); }
        .key[data-state="absent"] { background-color: #2b2b2c; opacity: 0.6; }

        /* Arayüz Pencereleri (Modal / Toast) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 12px 5px; border-radius: 10px; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: #2196f3; }
        .stat-lbl { font-size: 0.75rem; color: #bbb; margin-top: 4px; }

        .action-btn {
            border: none; padding: 14px; border-radius: 10px; font-size: 1.1rem; 
            font-weight: bold; width: 100%; margin-top: 12px; cursor: pointer; color: white;
        }
        .btn-blue { background: linear-gradient(135deg, #2196f3, #1976d2); }
        .btn-green { background: linear-gradient(135deg, #538d4e, #3e6b3a); }
        .btn-gray { background: #3a3a3c; }

        .toast {
            position: fixed; top: 12%; left: 50%; transform: translateX(-50%);
            background: white; color: black; padding: 14px 28px; border-radius: 10px;
            font-weight: bold; font-size: 1.1rem; display: none; z-index: 2000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: slideDown 0.3s ease-out;
        }

        /* Animasyonlar */
        @keyframes pop { 50% { transform: scale(1.15); } }
        @keyframes flip { 0% { transform: rotateX(0deg); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0deg); } }
        @keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-8px); } 40%, 60% { transform: translateX(8px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { top: 5%; opacity: 0; } to { top: 12%; opacity: 1; } }

        @media (max-height: 750px) {
            .key { height: 48px; }
            h1 { font-size: 1.3rem; }
            #game-board { max-width: 320px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>KELİMEMATİK</h1>
        <div class="header-btns">
            <button class="lang-btn" onclick="toggleLanguage()" id="lang-toggle">🇹🇷 TR</button>
            <button class="icon-btn" id="hint-btn" onclick="useHint()">💡</button>
            <button class="icon-btn" onclick="showStats()">📊</button>
        </div>
    </header>

    <div class="mode-container">
        <button class="mode-btn active" id="btn-daily" onclick="switchMode('daily')">Günün Kelimesi</button>
        <button class="mode-btn" id="btn-unlimited" onclick="switchMode('unlimited')">Sınırsız Mod</button>
    </div>

    <div class="board-container">
        <div id="game-board"></div>
    </div>

    <div id="keyboard"></div>

    <div class="modal" id="modal-stats">
        <div class="modal-content">
            <h2 id="stats-title" style="margin-bottom: 10px;">İstatistikler</h2>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-val" id="st-played">0</div><div class="stat-lbl" id="lbl-played">Oyun</div></div>
                <div class="stat-box"><div class="stat-val" id="st-win">0</div><div class="stat-lbl" id="lbl-win">% Kazan</div></div>
                <div class="stat-box"><div class="stat-val" id="st-streak">0</div><div class="stat-lbl" id="lbl-streak">Seri</div></div>
                <div class="stat-box"><div class="stat-val" id="st-max">0</div><div class="stat-lbl" id="lbl-max">En İyi</div></div>
            </div>
            <div id="end-game-details"></div>
            <button class="action-btn btn-blue" id="btn-share" onclick="shareResult()" style="display:none;">Skoru Paylaş 📋</button>
            <button class="action-btn btn-green" id="btn-restart" onclick="restartGame()" style="display:none;">Yeni Oyun Oyna 🔄</button>
            <button class="action-btn btn-gray" onclick="closeModals()">Kapat</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Sözlükler
        const WORDS_TR = [
            "HAFTA", "ACELE", "ACEMİ", "ADRES", "AHENK", "AKŞAM", "AKTİF", "ALARM", "BANYO", "BARIŞ", 
            "BASİT", "BEYİN", "BİLET", "BİLGİ", "BİLİM", "BÖCEK", "BULUT", "CEVAP", "CİDDİ", "CİHAZ", 
            "ÇABUK", "ÇANTA", "ÇİÇEK", "ÇOCUK", "ÇÖZÜM", "DEĞER", "DENEY", "DENİZ",
            "DÜNYA", "EKRAN", "ELMAS", "ERKEK", "FİKİR", "FİYAT", "FİZİK", "GÜNEŞ", "GÜVEN", "GÜZEL", 
            "HABER", "HAYAT", "HEDEF", "HESAP", "İNSAN", "İŞLEM", "KADIN", "KAĞIT", "KALEM", "KANUN", 
            "KARAR", "KİTAP", "KURAL", "KÜÇÜK", "LİDER", "MADDE", "MAKUL", "MERAK", "MÜZİK", "NOKTA", 
            "ORMAN", "ÖRNEK", "PAKET", "PROJE", "RAKAM", "SABAH", "SANAT", 
            "SEBEP", "SEÇİM", "SİLAH", "SONUÇ", "SORUN", "ŞEHİR", "TARİH", 
            "TEMEL", "VAKİT", "VATAN", "YALAN", "YAPAY", "YAZAR", "ZAMAN"
        ];

        const WORDS_AZ = [
            "SALAM", "KİTAB", "QƏLƏM", "ŞƏHƏR", "HƏYAT", "İNSAN", "ZAMAN", "DÜNYA", "GÜNƏŞ", "YAĞIŞ",
            "QADIN", "BİLGİ", "SƏBƏB", "HƏFTƏ", "DƏQİQ", "QƏRAR", "VƏTƏN", "ÇİÇƏK", "KÖNÜL", "GÖZƏL",
            "TƏMİZ", "YAXŞI", "GÜCLÜ", "BÖYÜK", "KİÇİK", "BƏYAZ", "YAŞIL", "TƏLƏB", "DƏNİZ", "GİRİŞ",
            "BAXIŞ", "GÖRÜŞ", "XƏBƏR", "DƏYƏR", "SƏNƏT", "NƏĞMƏ", "SƏHƏR", "AXŞAM", "XƏYAL", "MƏKAN",
            "HƏKİM", "XƏSTƏ", "ÇÖRƏK", "MEYVƏ", "ŞƏKİL", "HÜQUQ", "TARİX", "QANUN", "İFADƏ", "MARAQ", 
            "ZƏFƏR", "ÇIXIŞ", "GÖRÜŞ", "ATMAQ", "RAYON"
        ];

        // Tam Standart Klavye Dizilimleri (Çift harf kesinlikle yok)
        const KEYBOARDS = {
            TR: [
                ['E','R','T','Y','U','I','O','P','Ğ','Ü'],
                ['A','S','D','F','G','H','J','K','L','Ş','İ'],
                ['ENTER','Z','C','V','B','N','M','Ö','Ç','DEL']
            ],
            AZ: [
                ['Q','Ü','E','R','T','Y','U','İ','O','P','Ö','Ğ'],
                ['A','S','D','F','G','H','J','K','L','I','Ə'],
                ['ENTER','Z','X','C','V','B','N','M','Ç','Ş','DEL']
            ]
        };

        // Sistem Değişkenleri
        let currentLang = localStorage.getItem('km_lang') || 'TR';
        let currentMode = localStorage.getItem('km_mode') || 'daily';
        let targetWord = "";
        let currentRow = 0;
        let currentTile = 0;
        let isGameOver = false;
        let hintUsed = false;
        let boardState = Array(6).fill("");
        let stats = { played: 0, wins: 0, streak: 0, maxStreak: 0 };
        
        // Ghost Click (Çift basma) Engelleme Kilidi
        let lastInputTime = 0; 
        const DEBOUNCE_MS = 150; 

        window.onload = () => {
            loadStats();
            updateLangUI();
            
            // Eğer kaydedilmiş bir yarım oyun varsa yükle, yoksa yeni başlat
            if (!loadGameState()) {
                initBoard();
                setupGameLogic(currentMode);
            }
            
            renderKeyboard();
            applySavedBoardState(); // Klavye ve tahtayı eski oyun durumuna getirir
        };

        function toggleLanguage() {
            currentLang = currentLang === 'TR' ? 'AZ' : 'TR';
            localStorage.setItem('km_lang', currentLang);
            updateLangUI();
            renderKeyboard();
            switchMode(currentMode, true); // Dil değişince tahtayı zorla sıfırla
            showToast(currentLang === 'TR' ? "Dil: Türkçe" : "Dil: Azərbaycan dili");
        }

        function updateLangUI() {
            document.getElementById('lang-toggle').innerHTML = currentLang === 'TR' ? '🇹🇷 TR' : '🇦🇿 AZ';
            document.getElementById('btn-daily').innerText = currentLang === 'TR' ? 'Günün Kelimesi' : 'Günün Sözü';
            document.getElementById('btn-unlimited').innerText = currentLang === 'TR' ? 'Sınırsız Mod' : 'Limitsiz Mod';
            document.getElementById('stats-title').innerText = currentLang === 'TR' ? 'İstatistikler' : 'Statistikalar';
            document.getElementById('lbl-played').innerText = currentLang === 'TR' ? 'Oyun' : 'Oyun';
            document.getElementById('lbl-win').innerText = currentLang === 'TR' ? '% Kazan' : '% Qazan';
            document.getElementById('lbl-streak').innerText = currentLang === 'TR' ? 'Seri' : 'Seriya';
            document.getElementById('lbl-max').innerText = currentLang === 'TR' ? 'En İyi' : 'Ən Yaxşı';
            document.getElementById('btn-restart').innerText = currentLang === 'TR' ? 'Yeni Oyun Oyna 🔄' : 'Yeni Oyun Oyna 🔄';
            document.getElementById('btn-share').innerText = currentLang === 'TR' ? 'Skoru Paylaş 📋' : 'Nəticəni Paylaş 📋';
        }

        function renderKeyboard() {
            const kbContainer = document.getElementById('keyboard');
            kbContainer.innerHTML = '';
            const layout = KEYBOARDS[currentLang];

            layout.forEach(rowKeys => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'k-row';
                
                rowKeys.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key';
                    if (key === 'ENTER' || key === 'DEL') btn.classList.add('wide');
                    
                    btn.textContent = key === 'DEL' ? '⌫' : key;
                    btn.id = `key-${key}`;
                    
                    // Native App için Touch/Click olaylarını güvenli birleştirme
                    btn.addEventListener('pointerdown', (e) => {
                        e.preventDefault(); // WebView'da metin seçimini ve ghost click'i engeller
                        handleInput(key);
                    });
                    
                    rowDiv.appendChild(btn);
                });
                kbContainer.appendChild(rowDiv);
            });
        }

        function switchMode(mode, forceReset = false) {
            currentMode = mode;
            localStorage.setItem('km_mode', mode);
            document.getElementById('btn-daily').classList.toggle('active', mode === 'daily');
            document.getElementById('btn-unlimited').classList.toggle('active', mode === 'unlimited');
            
            // Eğer dil veya mod zorla değiştirildiyse eski kaydı sil ve sıfırla
            if (forceReset || isGameOver || !loadGameState()) {
                resetBoard();
                setupGameLogic(mode);
                saveGameState();
            } else {
                applySavedBoardState();
            }
            
            document.getElementById('btn-restart').style.display = mode === 'unlimited' && isGameOver ? 'block' : 'none';
        }

        function setupGameLogic(mode) {
            const wordList = currentLang === 'TR' ? WORDS_TR : WORDS_AZ;

            if (mode === 'daily') {
                const today = new Date().toISOString().slice(0, 10);
                let hash = 0;
                for (let i = 0; i < today.length; i++) hash = today.charCodeAt(i) + ((hash << 5) - hash);
                const index = Math.abs(hash) % wordList.length;
                targetWord = wordList[index];
            } else {
                targetWord = wordList[Math.floor(Math.random() * wordList.length)];
            }
        }

        function initBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = 'row';
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }
        }

        function resetBoard() {
            currentRow = 0;
            currentTile = 0;
            isGameOver = false;
            hintUsed = false;
            boardState = Array(6).fill("");
            
            document.getElementById('hint-btn').classList.remove('used');
            initBoard();
            document.querySelectorAll('.key').forEach(k => k.removeAttribute('data-state'));
            document.getElementById('btn-share').style.display = 'none';
            document.getElementById('btn-restart').style.display = 'none';
        }

        function handleInput(key) {
            // DEBOUNCE: Çift basmayı (Ghost Click) %100 engeller
            const now = Date.now();
            if (now - lastInputTime < DEBOUNCE_MS) return; 
            lastInputTime = now;

            if (isGameOver) return;

            if (key === 'DEL') {
                if (currentTile > 0) {
                    currentTile--;
                    const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
                    tile.textContent = '';
                    tile.removeAttribute('data-state');
                    boardState[currentRow] = boardState[currentRow].slice(0, -1);
                }
            } else if (key === 'ENTER') {
                if (currentTile === 5) {
                    checkRow();
                } else {
                    showToast(currentLang === 'TR' ? "Eksik Harf!" : "Əksik Hərf!");
                    shakeRow(currentRow);
                }
            } else if (currentTile < 5 && key.length === 1) {
                const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
                tile.textContent = key;
                tile.setAttribute('data-state', 'pop');
                boardState[currentRow] += key;
                currentTile++;
            }
            saveGameState();
        }

        function checkRow() {
            const guess = boardState[currentRow];
            const target = targetWord;
            const rowTiles = [];
            for (let i = 0; i < 5; i++) rowTiles.push(document.getElementById(`tile-${currentRow}-${i}`));

            const targetLetterCounts = {};
            for (let char of target) targetLetterCounts[char] = (targetLetterCounts[char] || 0) + 1;

            const tileStates = Array(5).fill('absent');

            // 1. Aşama: Doğru yerdeki harfleri bul
            for (let i = 0; i < 5; i++) {
                if (guess[i] === target[i]) {
                    tileStates[i] = 'correct';
                    targetLetterCounts[guess[i]]--;
                }
            }

            // 2. Aşama: Yanlış yerdeki harfleri bul
            for (let i = 0; i < 5; i++) {
                if (tileStates[i] !== 'correct' && targetLetterCounts[guess[i]] > 0) {
                    tileStates[i] = 'present';
                    targetLetterCounts[guess[i]]--;
                }
            }

            // Animasyonla harfleri çevirme
            rowTiles.forEach((tile, i) => {
                setTimeout(() => {
                    tile.classList.add('flip');
                    tile.setAttribute('data-state', tileStates[i]);
                    updateKey(guess[i], tileStates[i]);
                }, i * 200);
            });

            setTimeout(() => {
                if (guess === target) {
                    isGameOver = true;
                    updateStats(true);
                    showToast("🎉");
                    document.getElementById('btn-share').style.display = 'block';
                    if (currentMode === 'unlimited') document.getElementById('btn-restart').style.display = 'block';
                    setTimeout(showStats, 1000);
                } else if (currentRow === 5) {
                    isGameOver = true;
                    updateStats(false);
                    showToast(target);
                    document.getElementById('btn-share').style.display = 'block';
                    if (currentMode === 'unlimited') document.getElementById('btn-restart').style.display = 'block';
                    setTimeout(showStats, 1500);
                } else {
                    currentRow++;
                    currentTile = 0;
                }
                saveGameState();
            }, 1200);
        }

        function updateKey(letter, state) {
            const k = document.getElementById(`key-${letter}`);
            if (k) {
                const currentState = k.getAttribute('data-state');
                if (currentState !== 'correct') k.setAttribute('data-state', state);
            }
        }

        function shakeRow(row) {
            for (let i = 0; i < 5; i++) {
                const tile = document.getElementById(`tile-${row}-${i}`);
                tile.classList.add('shake');
                setTimeout(() => tile.classList.remove('shake'), 500);
            }
        }

        function useHint() {
            if (isGameOver) return;
            if (hintUsed) {
                showToast(currentLang === 'TR' ? "İpucu hakkın bitti!" : "İpucu haqqınız bitdi!");
                return;
            }

            // Doğru harfi tahtaya otomatik yazar
            for (let i = 0; i < 5; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                if (!tile.textContent) {
                    handleInput(targetWord[i]);
                    hintUsed = true;
                    document.getElementById('hint-btn').classList.add('used');
                    showToast(currentLang === 'TR' ? "İpucu kullanıldı" : "İpucu istifadə edildi");
                    saveGameState();
                    break;
                }
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        // --- KAYIT SİSTEMLERİ ---
        function loadStats() {
            const data = localStorage.getItem('km_stats');
            if (data) stats = JSON.parse(data);
        }

        function updateStats(won) {
            stats.played++;
            if (won) {
                stats.wins++;
                stats.streak++;
                if (stats.streak > stats.maxStreak) stats.maxStreak = stats.streak;
            } else {
                stats.streak = 0;
            }
            localStorage.setItem('km_stats', JSON.stringify(stats));
        }

        function saveGameState() {
            const state = {
                lang: currentLang, mode: currentMode, targetWord, currentRow, 
                currentTile, isGameOver, hintUsed, boardState
            };
            localStorage.setItem('km_gameState', JSON.stringify(state));
        }

        function loadGameState() {
            const data = localStorage.getItem('km_gameState');
            if (!data) return false;
            
            const state = JSON.parse(data);
            // Sadece aynı dil ve aynı modsa yükle, günlük kelime ise ve gün değiştiyse yükleme
            if (state.lang !== currentLang || state.mode !== currentMode) return false;
            
            if (state.mode === 'daily') {
                const wordList = currentLang === 'TR' ? WORDS_TR : WORDS_AZ;
                const today = new Date().toISOString().slice(0, 10);
                let hash = 0;
                for (let i = 0; i < today.length; i++) hash = today.charCodeAt(i) + ((hash << 5) - hash);
                const expectedWord = wordList[Math.abs(hash) % wordList.length];
                if (state.targetWord !== expectedWord) return false; // Gün değişmiş, yeni kelime gelmiş
            }

            targetWord = state.targetWord; currentRow = state.currentRow; 
            currentTile = state.currentTile; isGameOver = state.isGameOver;
            hintUsed = state.hintUsed; boardState = state.boardState || Array(6).fill("");
            return true;
        }

        function applySavedBoardState() {
            initBoard();
            if (hintUsed) document.getElementById('hint-btn').classList.add('used');
            
            // Geçmiş satırları anında kontrol edip renklendir
            for (let r = 0; r < currentRow; r++) {
                const guess = boardState[r];
                const targetLetterCounts = {};
                for (let char of targetWord) targetLetterCounts[char] = (targetLetterCounts[char] || 0) + 1;
                
                const tileStates = Array(5).fill('absent');
                for (let i = 0; i < 5; i++) {
                    if (guess[i] === targetWord[i]) { tileStates[i] = 'correct'; targetLetterCounts[guess[i]]--; }
                }
                for (let i = 0; i < 5; i++) {
                    if (tileStates[i] !== 'correct' && targetLetterCounts[guess[i]] > 0) { tileStates[i] = 'present'; targetLetterCounts[guess[i]]--; }
                }

                for (let c = 0; c < 5; c++) {
                    const tile = document.getElementById(`tile-${r}-${c}`);
                    tile.textContent = guess[c];
                    tile.setAttribute('data-state', tileStates[c]);
                    updateKey(guess[c], tileStates[c]);
                }
            }

            // Mevcut yarım kalan satırı doldur
            const currentGuess = boardState[currentRow] || "";
            for (let c = 0; c < currentGuess.length; c++) {
                const tile = document.getElementById(`tile-${currentRow}-${c}`);
                tile.textContent = currentGuess[c];
            }

            if (isGameOver) {
                document.getElementById('btn-share').style.display = 'block';
                if (currentMode === 'unlimited') document.getElementById('btn-restart').style.display = 'block';
            }
        }

        function showStats() {
            document.getElementById('st-played').textContent = stats.played;
            document.getElementById('st-win').textContent = stats.played ? Math.round((stats.wins / stats.played) * 100) : 0;
            document.getElementById('st-streak').textContent = stats.streak;
            document.getElementById('st-max').textContent = stats.maxStreak;
            
            const details = document.getElementById('end-game-details');
            if (isGameOver) {
                const winMsg = currentLang === 'TR' ? 'Tebrikler, Kazandınız!' : 'Təbriklər, Qazandınız!';
                const loseMsg = currentLang === 'TR' ? 'Kelime: ' : 'Söz: ';
                const won = (currentRow < 6 && boardState[currentRow-1] === targetWord) || (boardState[5] === targetWord);
                
                details.innerHTML = `<p style="margin-top:15px; font-weight:bold; font-size:1.2rem; color:${won ? '#538d4e' : '#e57373'}">
                    ${won ? winMsg : loseMsg + targetWord}
                </p>`;
            } else {
                details.innerHTML = '';
            }
            document.getElementById('modal-stats').style.display = 'flex';
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }

        function restartGame() {
            closeModals();
            switchMode('unlimited', true);
        }

        function shareResult() {
            const title = currentLang === 'TR' ? 'KelimeMatik Pro' : 'SözMatik Pro';
            const modeTxt = currentMode === 'daily' ? (currentLang === 'TR' ? 'Günün Kelimesi' : 'Günün Sözü') : (currentLang === 'TR' ? 'Sınırsız Mod' : 'Limitsiz Mod');
            let emojiBoard = `${title} (${modeTxt}) ${isGameOver && boardState[currentRow > 5 ? 5 : (boardState[currentRow]===targetWord ? currentRow : currentRow-1)] === targetWord ? (currentRow === 6 && boardState[5] !== targetWord ? 'X' : (currentRow === 6 ? 6 : currentRow)) : 'X'}/6\n\n`;
            
            const endRow = (isGameOver && currentRow < 6) ? currentRow : (currentRow === 6 ? 5 : currentRow-1);
            
            for (let r = 0; r <= endRow; r++) {
                for (let c = 0; c < 5; c++) {
                    const state = document.getElementById(`tile-${r}-${c}`).getAttribute('data-state');
                    if (state === 'correct') emojiBoard += '🟩';
                    else if (state === 'present') emojiBoard += '🟨';
                    else emojiBoard += '⬛';
                }
                emojiBoard += '\n';
            }
            
            navigator.clipboard.writeText(emojiBoard);
            showToast(currentLang === 'TR' ? "Sonuç Kopyalandı!" : "Nəticə Kopyalandı!");
        }
    </script>
</body>
